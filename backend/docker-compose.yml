services:
  db:
    image: postgres:15-alpine
    container_name: clinq
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - clinq_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    # Note: Use your actual project name below instead of 'myproject'
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"

# This must be at the bottom and NOT indented
volumes:
  clinq_data: